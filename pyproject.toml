[project]
name = "dieture_board"
authors = [{ name = "Dieture", email = "tech@dieture.com" }]
description = "Dieture Board: the one-place execution system (Scores, Bets, Promises, Standing Numbers)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
